[project]
name = "smolllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "requests>=2.34.2",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
[[tool.mypy.overrides]]
module = ["ddgs.*", "ollama.*", "transformers.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["agentic.*"]
ignore_missing_imports = false
